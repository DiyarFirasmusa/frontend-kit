name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static checks (JSON, versions, skills, hooks, shellcheck)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck jq
          bash scripts/validate-repo.sh

  hook-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Fixture project (tsc, vitest, oxlint, oxfmt)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq jq
          mkdir -p "$RUNNER_TEMP/fixture" && cd "$RUNNER_TEMP/fixture"
          npm init -y >/dev/null
          npm i -D typescript vitest oxlint oxfmt >/dev/null
          git init -q && git config user.email ci@example.com && git config user.name ci
          echo "KIT_TEST_PROJECT=$PWD" >> "$GITHUB_ENV"
      - name: Working modes self-test
        run: bash plugins/wajiha-kit/scripts/mode-test.sh
      - name: Hook self-test
        run: bash plugins/wajiha-kit/scripts/test-hooks.sh

  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      # The build runs the plugin's guard script on throwaway `git init` repos,
      # so it needs bash, git and jq but not the repository's history.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install jq
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq
      - name: Install dependencies
        run: npm ci --no-fund --no-audit
      - name: Type and template check
        run: npx astro check
      - name: Build
        run: npm run build
