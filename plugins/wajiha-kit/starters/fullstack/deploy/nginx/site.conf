# nginx in front of the Node server. Goes in /etc/nginx/conf.d/ (see docker-compose.yml).
# Not tested with a real nginx in this repository: run "nginx -t" with this file before every deploy.
#
# What lives here: hardening, size and time limits, rate limiting, compression of pages, real client IPs.
# What does NOT live here: security headers (CSP, HSTS, X-Frame-Options ...) and Cache-Control for the
# hashed files. The app sends them (src/shared/server/security-headers.ts and the route rules in
# vite.config.ts). A header set in two places drifts apart, so there is one place.
# HTTPS: terminate TLS at the edge (a load balancer or a TLS server block in front of this one).
# Listens on 8080 because the image runs nginx as a non-root user (nginx-unprivileged).

# --- Real client IP ---
# Behind a load balancer, $remote_addr is the load balancer, so every visitor would share ONE rate-limit
# bucket (10 contact messages a minute for the whole site). Trust the forwarded address only from your
# load balancer: uncomment and put its address range in place of the example below.
# set_real_ip_from 10.0.0.0/8;
# real_ip_header X-Forwarded-For;
# real_ip_recursive on;

# The original scheme: from the load balancer when there is one, otherwise this connection's own.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

limit_req_zone $binary_remote_addr zone=forms:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=pages:10m rate=30r/s;

upstream app {
    server app:3000;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;

    # --- Size and time limits (slow-client and large-body attacks). The app refuses server function
    # bodies over 16 KB itself as well, for when it runs without this nginx. ---
    client_max_body_size 64k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 10s;
    server_tokens off;

    # --- Compression ---
    # Built JS and CSS already arrive compressed (brotli or gzip, chosen by the app from Accept-Encoding),
    # and nginx leaves them as they are. This covers pages, sitemap and the rest. Nitro sends JavaScript
    # as text/javascript, so that type must be in the list.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json
               application/manifest+json application/xml image/svg+xml;

    # The same headers to the app for every location (an add_header or proxy_set_header inside a
    # location would replace these, so locations below add none).
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    # $http_host keeps the port (for example localhost:8080), which the app's same-origin check compares.
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;

    # --- Hardening ---
    # Dot files are never served, except .well-known (security.txt, certificate challenges).
    location ~ /\.(?!well-known) {
        return 404;
    }
    # Scanners looking for other stacks get no answer at all.
    location ~* \.(php|asp|aspx|jsp|cgi|env|git|sql|bak)$ {
        return 444;
    }
    if ($http_user_agent ~* "(sqlmap|nikto|masscan|nmap|zgrab)") {
        return 444;
    }

    # --- Hashed build files (the app sends "immutable" caching for them) ---
    location /assets/ {
        proxy_pass http://app;
        limit_req zone=pages burst=100 nodelay;
    }

    # --- The contact form (server function): a few messages per minute per visitor ---
    location /_serverFn/ {
        proxy_pass http://app;
        limit_req zone=forms burst=5 nodelay;
        limit_req_status 429;
    }

    # --- The admin's API (VITE_ADMIN_API_URL=/api on this host) ---
    # This starter has no backend: with the mock off, /api reaches the Node app and gets the site's 404 page.
    # When you add a backend, proxy /api to it here, and give the login a much stricter limit than pages
    # (uncomment, and add this line next to the other zones above:
    #   limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
    # ). Lockout after repeated failures belongs in the backend itself: nginx only slows a single address.
    # location = /api/auth/login {
    #     proxy_pass http://your-backend;
    #     limit_req zone=login burst=5 nodelay;
    #     limit_req_status 429;
    # }
    # location /api/ {
    #     proxy_pass http://your-backend;
    #     limit_req zone=pages burst=60 nodelay;
    # }

    # --- Everything else: pages, sitemap, robots, images ---
    location / {
        proxy_pass http://app;
        proxy_read_timeout 30s;
        limit_req zone=pages burst=60 nodelay;
        # Pages carry a per-response CSP nonce: never cache the HTML at the edge.
    }
}
