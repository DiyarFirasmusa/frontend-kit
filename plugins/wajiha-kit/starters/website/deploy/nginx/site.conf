# nginx in front of the Node server. Goes in /etc/nginx/conf.d/ (see docker-compose.yml).
# Not tested with a real nginx in this repository: run "nginx -t" with this file before every deploy.
#
# What lives here: hardening, size and time limits, rate limiting, compression and caching of hashed files.
# What does NOT live here: security headers (CSP, HSTS, X-Frame-Options ...). The app sends them from
# src/shared/server/security-headers.ts. A header set in two places drifts apart, so there is one place.
# HTTPS: terminate TLS at the edge (a load balancer or a TLS server block in front of this one) and
# keep "X-Forwarded-Proto" correct; the app sends HSTS itself.

limit_req_zone $binary_remote_addr zone=forms:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=pages:10m rate=30r/s;

upstream app {
    server app:3000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # --- Size and time limits (slow-client and large-body attacks) ---
    client_max_body_size 64k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 10s;
    server_tokens off;

    # --- Compression ---
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    # --- Hardening ---
    # Dot files are never served, except .well-known (security.txt, certificate challenges).
    location ~ /\.(?!well-known) {
        return 404;
    }
    # Scanners looking for other stacks get no answer at all.
    location ~* \.(php|asp|aspx|jsp|cgi|env|git|sql|bak)$ {
        return 444;
    }
    if ($http_user_agent ~* "(sqlmap|nikto|masscan|nmap|zgrab)") {
        return 444;
    }

    # --- Hashed build files: cache for a year, they change name when they change ---
    location /assets/ {
        proxy_pass http://app;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        limit_req zone=pages burst=100 nodelay;
    }

    # --- The contact form (server function): a few messages per minute per visitor ---
    location /_serverFn/ {
        proxy_pass http://app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        limit_req zone=forms burst=5 nodelay;
        limit_req_status 429;
    }

    # --- Everything else: pages, sitemap, robots, images ---
    location / {
        proxy_pass http://app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        limit_req zone=pages burst=60 nodelay;
        # Pages carry a per-response CSP nonce: never cache the HTML at the edge.
        # Add Cache-Control for images here when they are big (they are small SVGs now).
    }
}
